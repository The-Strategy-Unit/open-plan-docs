- id: CLASS_AE_MINOR
  type: casemix
  definition: Minor attendances
  logic: acuity IN {3,4,5} or acuity IS NULL / unknown
  variables:
  - acuity
  parent: CLASS_AE
  notes: Ambulatory, less severe conditions

- id: CLASS_AE_MAJOR
  type: casemix
  definition: Major attendances
  logic: acuity = 2
  variables:
  - acuity
  parent: CLASS_AE
  notes: Serious illnessess and injuries requiring trolley-based care

- id: CLASS_AE_RESUS
  type: casemix
  definition: Resus attendances
  logic: acuity = 1
  variables:
  - acuity
  parent: CLASS_AE
  notes: Critically ill or life-threatening emergencies

- id: CLASS_AGE_ADULT
  type: age
  definition: Adult patients
  logic: age >= 18 years
  variables:
  - age
  parent: null
  notes: Age in years at attendance / admission

- id: CLASS_AGE_CHILD
  type: age
  definition: Children
  logic: age < 18 years
  variables:
  - age
  parent: null
  notes: Age in years at attendance / admission

- id: CLASS_AE
  type: scope
  definition: Core A&E attendances
  logic: aedepttype = 1
  variables:
  - aedepttype
  parent: null
  notes: Core A&E scope; consultant-led 24/7 with full resuscitation facilities; excludes type 2 mono-specialty units.

- id: CLASS_DAYCASE
  type: scope
  definition: Core daycase spells
  logic: admimeth = 1 AND classpat = 2
  variables:
  - admimeth
  - classpat
  parent: null
  notes: Core daycase spells

- id: CLASS_MEDICAL
  type: specialty
  definition: Medical specialties
  logic: tretspef IN medical
  variables:
  - tretspef
  parent: null
  notes: Medical treatment specialties

- id: CLASS_SURGICAL
  type: specialty
  definition: Surgical specialties
  logic: tretspef IN surgical
  variables:
  - tretspef
  parent: null
  notes: Surgical treatment specialties

- id: CLASS_ENDOSCOPY
  type: procedures
  definition: Endoscopy procedures
  logic: primaryprocedure IN {G14,G15,G16,G17,G18,G19,G20 (Oesophagoscopy); G42,G43,G44,G45,G46 (OGD); G54,G55 (Duodenoscopy); G64,G65 (Jejunoscopy); G79,G80 (Ileoscopy); H23,H24,H25,H26,H27,H28,H37,H69,H70,H71 (Sigmoidoscopy); J38,J39,J40,J41,J42,J43,J44,J45 (ERCP); H20,H21,H22,H68 (Colonoscopy); E48,E49,E50,E51 (Bronchoscopy)};
  variables:
  - primaryprocedure
  parent: null
  notes: Endoscopy procedures

- id: CLASS_AGE_NEONATAL
  type: age
  definition: Neonate or newborn
  logic: age < 29 days
  variables:
  - age
  parent: null
  notes: Age in years at attendance / admission

- id: CLASS_AGE_PAEDIATRIC
  type: age
  definition: Children (excl. neonates)
  logic: age >= 29 days AND age < 18 years
  variables:
  - age
  parent: null
  notes: Age in years at attendance / admission

