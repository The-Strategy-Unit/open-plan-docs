- id: CLASS_ELECTIVE
  type: admission_type
  definition: Elective admissions
  logic: admimeth LIKE 1* AND classpat = 1
  variables:
  - admimeth
  parent: null
  notes: null

- id: CLASS_REGULAR_DAY_NIGHT
  type: admission_type
