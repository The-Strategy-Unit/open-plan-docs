functional_area_id: DAYCASE_THEATRES
title: Daycase theatres

definition:
  A theatre for daycase procedures is a dedicated procedural operating space
  used to perform planned same-day surgical interventions that do not require an
  overnight hospital stay.

activity_classification: |-
  Includes all daycase spells with a recorded procedure, grouped into:

  * Adult surgical activity, and
  * Paediatric activity.

workload_derivation: |-
  The primary procedure from each qualifying daycase spell is used to estimate theatre
  hours using the assumed procedure time.

  !!! quote ""

      $$
      \text{Procedure hours}
      =
      \text{Procedures} 
      \times
      \frac{\text{Procedure time (minutes)}}{60}
      $$

capacity_conversion: |-
  Divide total procedure hours by the service's annual operational hours and the assumed
  utilisation rate.

  !!! quote ""

      $$
      \text{Required daycase theatres}
      =
      \frac{\text{Procedure hours}}
      {\text{Annual operational hours} \times \text{Utilisation rate}}
      $$
